# Postgres + migrations + API, for local runs and the Bruno suite (CI uses the same file).
services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: u, POSTGRES_PASSWORD: p, POSTGRES_DB: streamnext }
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U u -d streamnext"]
      interval: 2s
      retries: 30
  migrate:
    build: .
    entrypoint: ["/app/migrate"]
    environment:
      DATABASE_URL: &dburl postgres://u:p@db:5432/streamnext?sslmode=disable
    depends_on: { db: { condition: service_healthy } }
  api:
    build: .
    environment:
      DATABASE_URL: *dburl
      JWT_SECRET: bruno-and-ci-only-secret-never-used-for-real-0123456789
      REFRESH_GRACE_SECONDS: "0" # makes refresh-token reuse detection immediate, so Bruno can assert it
      # Providers are enabled (so garbage tokens are a 401, not a 503) but no real token can pass.
      APPLE_CLIENT_ID: ci.example.app
      GOOGLE_CLIENT_IDS: ci-google-client.apps.googleusercontent.com
    ports: ["8080:8080"]
    depends_on: { migrate: { condition: service_completed_successfully } }
