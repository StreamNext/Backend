name: CI
on:
  pull_request:
  push:
    branches: [develop, main]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
        with: { path: Backend }
      # The contract lives in the (public) Proto repo; Makefile expects it at ../Proto.
      # Use the branch matching this one (develop or main; PRs use their target branch).
      - uses: actions/checkout@v4
        with: { repository: StreamNext/Proto, path: Proto, ref: "${{ github.base_ref || github.ref_name }}" }
      - uses: actions/setup-go@v5
        with: { go-version-file: Backend/go.mod }
      - uses: sqlc-dev/setup-sqlc@v4
        with: { sqlc-version: "1.31.1" }
      - name: Generated code is current
        run: sqlc diff && make generate-api && test -z "$(gofmt -l .)"
      - name: Unit + Postgres tests, 90% coverage gate
        run: make test
      - name: Bruno integration suite
        run: make bruno
