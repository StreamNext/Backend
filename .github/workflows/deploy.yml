# Untested until the GCP project + Workload Identity Federation exist.
# Needs repo variables: GCP_PROJECT, GCP_WIF_PROVIDER, GCP_SERVICE_ACCOUNT;
# Artifact Registry repo `streamnext`; Secret Manager secret `streamnext-database-url` (Neon direct URL).
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
env:
  REGION: us-central1
  SERVICE: streamnext-api
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
        with: { path: Backend }
      - uses: actions/checkout@v4
        with: { repository: StreamNext/Proto, path: Proto }
      - uses: actions/setup-go@v5
        with: { go-version-file: Backend/go.mod }
      - run: make generate
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and push image
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          IMAGE="$REGION-docker.pkg.dev/${{ vars.GCP_PROJECT }}/streamnext/backend:${{ github.sha }}"
          docker build -t "$IMAGE" . && docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Migrate
        run: |
          URL=$(gcloud secrets versions access latest --secret=streamnext-database-url --project="${{ vars.GCP_PROJECT }}")
          echo "::add-mask::$URL"
          DATABASE_URL="$URL" go run ./cmd/migrate
      - name: Deploy Cloud Run service
        run: |
          gcloud run deploy "$SERVICE" --image "$IMAGE" --region "$REGION" --project "${{ vars.GCP_PROJECT }}" \
            --allow-unauthenticated --cpu-boost --set-secrets DATABASE_URL=streamnext-database-url:latest
